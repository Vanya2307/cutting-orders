<label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if not field.field.required %}
        <span class="text-secondary fw-normal">(по желание)</span>
    {% endif %}
</label>

{% if input_prefix %}
    <div class="input-group">
        <span class="input-group-text">{{ input_prefix }}</span>
        {{ field }}
    </div>
{% else %}
    {{ field }}
{% endif %}

{% if field.help_text %}
    <div class="form-text" id="{{ field.auto_id }}_helptext">
        {{ field.help_text|safe }}
    </div>
{% endif %}

{% if field.errors %}
    <div id="{{ field.auto_id }}_error">
        {% for error in field.errors %}
            <div class="field-error">{{ error }}</div>
        {% endfor %}
    </div>
{% endif %}
