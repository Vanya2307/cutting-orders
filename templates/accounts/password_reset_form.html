{% extends 'base.html' %}

{% block title %}Забравена парола | Онлайн заявки{% endblock %}

{% block content %}
    <h1 class="page-title">Забравена парола</h1>

    <p class="text-secondary mb-4">
        Въведете имейла си, за да получите връзка за нова парола.
    </p>

    <form method="post" class="drawing-form narrow-form" novalidate>
        {% csrf_token %}

        <div class="row g-4">
            <div class="col-12">
                {% include 'includes/form_field.html' with field=form.email %}
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn btn-accent">Изпрати връзка</button>
            <a class="btn btn-outline-secondary" href="{% url 'accounts:login' %}">Откажи</a>
        </div>
    </form>
{% endblock %}
