upstream django {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 56.228.135.126 localhost 127.0.0.1;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://56.228.135.126$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 56.228.135.126;

    ssl_certificate /etc/letsencrypt/live/56.228.135.126/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/56.228.135.126/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}